# Extra Fluent Bit config loaded via init process from S3.
# No [SERVICE] section — auto-generated config's [SERVICE] is preserved.
# Built-in parsers loaded via aws_fluent_bit_init_file env var (see task def).

# Parse JSON from app container logs
# ref: https://github.com/aws-samples/amazon-ecs-firelens-examples/tree/mainline/examples/fluent-bit/parse-json
[FILTER]
    Name         parser
    Match        app-firelens-*
    Key_Name     log
    Parser       json
    Reserve_Data On

# Tag audit logs (type=audit) for Firehose routing
[FILTER]
    Name         rewrite_tag
    Match        app-firelens-*
    Rule         $type ^(audit)$ audit.$TAG true

# All container logs -> CloudWatch Logs
[OUTPUT]
    Name                cloudwatch_logs
    Match               *-firelens-*
    region              ${AWS_REGION}
    log_group_name      ${LOG_GROUP}
    log_stream_prefix   firelens/
    auto_create_group   false
    retry_limit         2

# Audit logs -> Firehose -> S3 (durable storage)
[OUTPUT]
    Name                kinesis_firehose
    Match               audit.*
    region              ${AWS_REGION}
    delivery_stream     ${FIREHOSE_STREAM}
    retry_limit         5
