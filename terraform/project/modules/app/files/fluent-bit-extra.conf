# Extra Fluent Bit config loaded via init process from S3.
# No [SERVICE] section — auto-generated config's [SERVICE] is preserved.
# Built-in parsers loaded via aws_fluent_bit_init_file env var (see task def).
#
# All ECS container logs are routed to Firehose (no CloudWatch Logs).
# Audit records (type=audit) are rewritten with an `audit.*` tag so they
# go to the dedicated audit Firehose stream; non-audit app / nginx logs
# flow through each container's auto-generated Firehose output.

# Parse JSON from app container logs
# ref: https://github.com/aws-samples/amazon-ecs-firelens-examples/tree/mainline/examples/fluent-bit/parse-json
[FILTER]
    Name         parser
    Match        app-firelens-*
    Key_Name     log
    Parser       json
    Reserve_Data On

# Pull audit records out of the app stream into their own tag.
# false = discard original, so the container's auto-gen Firehose output
# only receives non-audit records.
[FILTER]
    Name         rewrite_tag
    Match        app-firelens-*
    Rule         $type ^(audit)$ audit.$TAG false

# Audit records → audit Firehose stream → S3 audit/ prefix
[OUTPUT]
    Name                kinesis_firehose
    Match               audit.*
    region              ${AWS_REGION}
    delivery_stream     ${AUDIT_STREAM}
    retry_limit         5
