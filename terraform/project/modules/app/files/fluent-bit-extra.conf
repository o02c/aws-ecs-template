# Extra Fluent Bit config loaded via init process from S3.
# No [SERVICE] section — auto-generated config's [SERVICE] is preserved.
# Built-in parsers loaded via aws_fluent_bit_init_file env var (see task def).
#
# CloudWatch output is handled by auto-generated config from logConfiguration.
# This file only adds JSON parsing and audit log routing to Firehose.

# Parse JSON from app container logs
# ref: https://github.com/aws-samples/amazon-ecs-firelens-examples/tree/mainline/examples/fluent-bit/parse-json
[FILTER]
    Name         parser
    Match        app-firelens-*
    Key_Name     log
    Parser       json
    Reserve_Data On

# Tag audit logs (type=audit) for Firehose routing
# false = discard original (audit logs go to Firehose/S3 only, not CloudWatch)
[FILTER]
    Name         rewrite_tag
    Match        app-firelens-*
    Rule         $type ^(audit)$ audit.$TAG false

# Audit logs -> Firehose -> S3 (durable storage, access-controlled)
[OUTPUT]
    Name                kinesis_firehose
    Match               audit.*
    region              ${AWS_REGION}
    delivery_stream     ${FIREHOSE_STREAM}
    retry_limit         5
