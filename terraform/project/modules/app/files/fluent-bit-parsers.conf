# Fluent Bit parsers — nginx (JSON) and Python.
#
# Loaded via FireLens init process (aws_fluent_bit_init_s3_2 env var on the
# log_router container). nginx_json_app is wired by default in
# fluent-bit-extra.conf (Match nginx-firelens-*) and depends on
# apps/nginx/nginx.conf using `log_format json_combined`. python_json is
# available but unused — opt in by replacing `Parser json` with
# `Parser python_json` in the app-firelens-* FILTER if extra fields like
# Time_Format need stricter handling.
#
# Parser names are suffixed `_app` to avoid collision with builtin parsers in
# /fluent-bit/parsers/parsers.conf (e.g. `nginx`) — Fluent Bit treats
# duplicate parser names as a fatal config error and refuses to start.
#
# Time_Keep On preserves the original timestamp string in the record so the
# Athena `timestamp` / `time` columns stay populated (without it, Fluent Bit
# consumes the field into its internal time and the column ends up empty).

# Django + Gunicorn JsonFormatter (apps/<svc>/config/logging_formatter.py).
# timestamp is ISO 8601 with timezone offset, produced by datetime.isoformat().
[PARSER]
    Name        python_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# Nginx access log — JSON. Paired with `log_format json_combined` in
# apps/nginx/nginx.conf. The fields produced (time, remote_addr, method, uri,
# status, bytes_sent, referer, user_agent, x_forwarded_for) flatten into the
# Firehose record and become top-level columns in Athena ecs_logs.
[PARSER]
    Name        nginx_json_app
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Time_Keep   On
