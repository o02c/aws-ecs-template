# JSON-formatted access log so Fluent Bit's nginx_json_app parser can flatten
# the fields into the Firehose record (queryable as top-level columns in
# Athena `ecs_logs`). escape=json is required to avoid breaking on quotes /
# control chars inside user-agent / referer values.
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes_sent":$bytes_sent,"referer":"$http_referer",'
  '"user_agent":"$http_user_agent","x_forwarded_for":"$http_x_forwarded_for"}';

server {
    listen 80;
    access_log /var/log/nginx/access.log json_combined;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 'ok';
    }
}
