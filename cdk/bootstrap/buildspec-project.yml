version: 0.2
phases:
  pre_build:
    commands:
      - cd cdk/project
      - echo "node_modules included in source zip, skipping npm install"
  build:
    commands:
      - npx cdk synth -c env=$ENV
      - |
        # Deploy in dependency order
        STACKS=(
          "${PROJECT_NAME}-${ENV}-Foundation"
          "${PROJECT_NAME}-${ENV}-Database"
          "${PROJECT_NAME}-${ENV}-Lane-user"
          "${PROJECT_NAME}-${ENV}-Lane-admin"
          "${PROJECT_NAME}-${ENV}-Application"
        )
        for stack_name in "${STACKS[@]}"; do
          template="cdk.out/${stack_name}.template.json"
          if [ -f "$template" ]; then
            echo "Deploying stack: $stack_name"
            aws cloudformation deploy \
              --template-file "$template" \
              --stack-name "$stack_name" \
              --role-arn "$CFN_SERVICE_ROLE_ARN" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset
          fi
        done
