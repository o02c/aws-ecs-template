# Parse JSON from container log field
[FILTER]
    Name         lua
    Match        *-firelens-*
    script       /fluent-bit/etc/parse_json.lua
    call         parse_json

# Tag audit logs for Firehose routing
[FILTER]
    Name         rewrite_tag
    Match        *-firelens-*
    Rule         $type ^(audit)$ audit.$TAG true

# All logs -> CloudWatch Logs
[OUTPUT]
    Name                cloudwatch_logs
    Match               *-firelens-*
    region              ${AWS_REGION}
    log_group_name      ${LOG_GROUP}
    log_stream_prefix   firelens/
    auto_create_group   false
    retry_limit         2

# Audit logs -> Firehose -> S3
[OUTPUT]
    Name                kinesis_firehose
    Match               audit.*
    region              ${AWS_REGION}
    delivery_stream     ${FIREHOSE_STREAM}
    retry_limit         5
