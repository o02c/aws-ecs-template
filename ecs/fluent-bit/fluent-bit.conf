# Why custom image is required:
# - logConfiguration generates exactly ONE [OUTPUT] per container (not an array).
#   Dual output (CloudWatch + Firehose) requires custom config with multiple [OUTPUT].
#   ref: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/firelens-taskdef.html
#   ref: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_LogConfiguration.html
# - rewrite_tag is a [FILTER] plugin — logConfiguration.options only generates [OUTPUT],
#   so tag-based routing is impossible without custom config.
# - Fargate does not support config-file-type: s3, so custom config must be
#   baked into the image (config-file-type: file).
#
# CloudWatch output is handled by auto-generated config from each container's
# logConfiguration (awsfirelens driver). This file only adds:
# 1. JSON parsing (Lua filter using bundled cjson)
# 2. Audit log routing (rewrite_tag + Firehose output)
#
# Note: [SERVICE] Parsers_File approach does not work because the auto-generated
# config already contains a [SERVICE] section, and a second one causes conflicts.

# Parse JSON from container stdout/stderr "log" field
[FILTER]
    Name         lua
    Match        *-firelens-*
    script       /fluent-bit/etc/parse_json.lua
    call         parse_json

# Tag audit logs for Firehose routing
[FILTER]
    Name         rewrite_tag
    Match        *-firelens-*
    Rule         $type ^(audit)$ audit.$TAG true

# Audit logs -> Firehose -> S3
[OUTPUT]
    Name                kinesis_firehose
    Match               audit.*
    region              ${AWS_REGION}
    delivery_stream     ${FIREHOSE_STREAM}
    retry_limit         5
