# Why custom image is required:
# - logConfiguration generates exactly ONE [OUTPUT] per container (not an array).
#   Dual output (CloudWatch + Firehose) requires custom config with rewrite_tag routing.
#   ref: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/firelens-taskdef.html
#   ref: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_LogConfiguration.html
# - rewrite_tag is a [FILTER] plugin — logConfiguration.options only generates [OUTPUT],
#   so tag-based routing is impossible without custom config.
# - Fargate does not support config-file-type: s3, so custom config must be
#   baked into the image (config-file-type: file).
#
# JSON parsing constraints:
# - Lua filter is not compiled in aws-for-fluent-bit v1.9.10.
# - [SERVICE] Parsers_File + parser filter conflicts with auto-generated config.
# - JSON log fields remain in "log" key. Use CloudWatch Logs Insights to parse.
# - Audit routing uses regex match on raw log string.

# Tag audit logs for Firehose routing
[FILTER]
    Name         rewrite_tag
    Match        *-firelens-*
    Rule         $log "type":\s*"audit" audit.$TAG true

# All logs -> CloudWatch Logs (parsed JSON in "log" field)
[OUTPUT]
    Name                cloudwatch_logs
    Match               *-firelens-*
    region              ${AWS_REGION}
    log_group_name      ${LOG_GROUP}
    log_stream_prefix   firelens/
    auto_create_group   false
    retry_limit         2

# Audit logs -> Firehose -> S3
[OUTPUT]
    Name                kinesis_firehose
    Match               audit.*
    region              ${AWS_REGION}
    delivery_stream     ${FIREHOSE_STREAM}
    retry_limit         5
